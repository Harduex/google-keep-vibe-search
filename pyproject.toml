[project]
name = "google-keep-vibe-search"
version = "0.1.0"
requires-python = ">=3.10"
# torch/torchvision are intentionally NOT in this flat list. They have two
# mutually exclusive install profiles — CUDA (the default, ~3 GB of wheels) and
# CPU — which cannot both be resolved at once. They live in the `gpu` and `cpu`
# dependency-groups below, with `[tool.uv.conflicts]` declaring the two groups
# mutually exclusive. `gpu` is a default group, so a plain `uv sync` still gets
# the CUDA build; see the "Install paths" note below for the CPU alternative.
#
# Every floor here that looks oddly specific is a security floor — it is the
# first patched release for a GitHub/Dependabot advisory against this project.
# Do not lower one without checking the advisory it closes.
dependencies = [
    "fastapi==0.141.0",
    "starlette==1.3.1",
    "uvicorn==0.52.0",
    "jinja2==3.1.6",
    "sentence-transformers>=5.6,<6",
    "scikit-learn==1.7.2",
    # 2.2.6 is the last numpy that publishes cp310 wheels; 2.3+ needs Python 3.11.
    "numpy==2.2.6",
    "python-multipart==0.0.32",
    "huggingface_hub>=1.5,<2",
    "transformers>=5.14,<6",
    "tokenizers>=0.22",
    "python-dotenv==1.2.2",
    "pydantic-settings>=2.0.0",
    "pydantic",
    "httpx>=0.24.1",
    "ftfy==6.1.3",
    # Floor, not a pin: transformers 5.x requires regex>=2025.10.22.
    "regex>=2025.10.22",
    "Pillow==12.3.0",
    "clip @ git+https://github.com/openai/CLIP.git",
    # umap-learn/hdbscan floors are the first releases that build against numpy 2.
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.44",
    "spacy>=3.8",
    "jellyfish",
    "networkx",
    "litellm>=1.94",
    "pydantic-ai-slim[openai]",
    "tbb>=2021.6.0",
    "tqdm"
]

# Install paths:
#   • GPU (default):  uv sync                            -> CUDA wheels, straight from PyPI.
#   • CPU only:       uv sync --no-group gpu --group cpu -> CPU wheels, via the `pytorch-cpu` index.
# GPU stays the default on purpose: the app calls .to("cuda"). Do not regress
# that by making CPU the default. The two groups conflict ([tool.uv.conflicts]
# below), so `uv sync --all-groups` is intentionally not valid — pick exactly
# one of {gpu, cpu}.
[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==5.12.0",
    "pre-commit>=3.6.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1"
]
# Default torch profile: the plain PyPI wheels, which are the CUDA build and pull
# their own cuda-toolkit/nvidia-* runtime wheels (CUDA 13.0 as of torch 2.13).
# There is no explicit index for this profile — that is why `[tool.uv.sources]`
# below maps torch/torchvision only for the `cpu` group. The project used to pin
# `+cu121` against download.pytorch.org, but that index stops at torch 2.5.1 and
# the advisories against torch need >= 2.13.0, so there is nothing to pin to
# there any more. CUDA 13 needs an NVIDIA driver >= 580.
gpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]
# Alternative torch profile for machines without an NVIDIA GPU: CPU wheels from
# download.pytorch.org/whl/cpu. Activate with `uv sync --no-group gpu --group cpu`,
# which keeps the flat `dependencies` above and only swaps the torch source, so
# none of the multi-GB cuda-toolkit/nvidia-* wheels are pulled.
cpu = [
    "torch==2.13.0+cpu",
    "torchvision==0.28.0+cpu",
]

[tool.uv]
default-groups = ["dev", "gpu"]
# The two torch profiles are mutually exclusive: the CUDA wheels and the +cpu
# wheels provide the same packages and cannot coexist in one environment. Each
# entry in the outer array is a set of (group, ...) members that cannot all be on.
conflicts = [
    [
        { group = "gpu" },
        { group = "cpu" }
    ]
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Only the `cpu` group is redirected. The `gpu` group deliberately has no source
# mapping so it resolves torch/torchvision from PyPI, where the default wheels
# are already CUDA-enabled.
[tool.uv.sources]
torch = [{ group = "cpu", index = "pytorch-cpu" }]
torchvision = [{ group = "cpu", index = "pytorch-cpu" }]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]
