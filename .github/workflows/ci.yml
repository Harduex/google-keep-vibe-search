name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync Python dependencies
        # NOT `--all-groups`: the `gpu` and `cpu` torch profiles are declared as
        # conflicting groups in pyproject.toml, so asking for all of them is an
        # error by construction. Runners have no NVIDIA GPU, so take the CPU
        # profile — it keeps the flat dependencies and only swaps the torch
        # source, and it avoids pulling ~2 GB of CUDA wheels on every run.
        run: uv sync --no-group gpu --group cpu

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Node dependencies
        working-directory: client
        run: npm ci

      - name: make check
        env:
          GOOGLE_KEEP_PATH: .
        run: make check
