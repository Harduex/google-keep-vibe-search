[project]
name = "google-keep-vibe-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.1.2+cu121",
    "torchvision==0.16.2+cu121",
    "fastapi==0.135.0",
    "starlette==0.52.1",
    "uvicorn==0.23.2",
    "jinja2==3.1.2",
    "sentence-transformers>=2.6,<3.0",
    "scikit-learn==1.3.0",
    "numpy==1.25.2",
    "python-multipart==0.0.6",
    "huggingface_hub>=0.20",
    "transformers>=4.36,<4.44",
    "tokenizers>=0.14",
    "python-dotenv==1.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic",
    "nltk>=3.8.1",
    "httpx>=0.24.1",
    "ftfy==6.1.3",
    "regex==2023.8.8",
    "Pillow==10.0.0",
    "clip @ git+https://github.com/openai/CLIP.git",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "rank-bm25>=0.2.2",
    "spacy>=3.0",
    "jellyfish",
    "networkx",
    "litellm>=1.40",
    "pydantic-ai-slim[openai]",
    "tbb>=2021.6.0",
    "tqdm"
]

[dependency-groups]
dev = [
    "black==23.7.0",
    "isort==5.12.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1"
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.black]
line-length = 100
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]
